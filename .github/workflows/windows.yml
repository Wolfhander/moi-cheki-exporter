name: Windows tests and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller --noconfirm moi_cheki_exporter.spec
      - name: Package Windows executable
        shell: pwsh
        run: |
          Copy-Item README.md,CHANGELOG.md -Destination dist
          Compress-Archive -Path dist/MoiCheki.exe,dist/README.md,dist/CHANGELOG.md -DestinationPath MoiCheki-windows-x64.zip
          $hash = (Get-FileHash MoiCheki-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  MoiCheki-windows-x64.zip" | Set-Content SHA256SUMS.txt
      - name: Publish assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --title "Мои чеки $env:GITHUB_REF_NAME" --generate-notes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $env:GITHUB_REF_NAME MoiCheki-windows-x64.zip SHA256SUMS.txt --clobber --repo $env:GITHUB_REPOSITORY
